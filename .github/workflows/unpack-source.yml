name: Expand project source archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source into the repository
        shell: bash
        run: |
          if [[ ! -f ortak-oyuncu-source.zip ]]; then
            echo "Source archive is already expanded."
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          unzip -q ortak-oyuncu-source.zip -d "$temp_dir"
          cp -R "$temp_dir"/. .
          rm -rf "$temp_dir" ortak-oyuncu-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand project source files"
          git push
